name: Update Meal Data

on:
  schedule:
    - cron: '0 15 * * *'   # 매일 00:00 KST
    - cron: '0 21 * * *'   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-meal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch meal data
        run: |
          TODAY=$(TZ=Asia/Seoul date +"%Y%m%d")
          # 직전 등교일: 월(1)→금(-3일), 일(7)→금(-2일), 그 외→-1일
          TODAY_DOW=$(TZ=Asia/Seoul date +"%u")
          if [ "$TODAY_DOW" -eq 1 ]; then
            YESTERDAY=$(TZ=Asia/Seoul date -d '-3 days' +"%Y%m%d")
          elif [ "$TODAY_DOW" -eq 7 ]; then
            YESTERDAY=$(TZ=Asia/Seoul date -d '-2 days' +"%Y%m%d")
          else
            YESTERDAY=$(TZ=Asia/Seoul date -d '-1 day' +"%Y%m%d")
          fi
          # 다음 등교일: 토(6)→+3일(월), 일(7)→+2일(월), 평일→+1일
          TOMORROW_DOW=$(TZ=Asia/Seoul date -d '+1 day' +"%u")
          if [ "$TOMORROW_DOW" -eq 6 ]; then
            TOMORROW=$(TZ=Asia/Seoul date -d '+3 days' +"%Y%m%d")
          elif [ "$TOMORROW_DOW" -eq 7 ]; then
            TOMORROW=$(TZ=Asia/Seoul date -d '+2 days' +"%Y%m%d")
          else
            TOMORROW=$(TZ=Asia/Seoul date -d '+1 day' +"%Y%m%d")
          fi

          fetch_menus() {
            local YMD=$1
            local RES=$(curl -sG --max-time 10 \
              "https://open.neis.go.kr/hub/mealServiceDietInfo" \
              -d "Type=json&pIndex=1&pSize=1&MMEAL_SC_CODE=2" \
              -d "ATPT_OFCDC_SC_CODE=J10&SD_SCHUL_CODE=7692182" \
              -d "MLSV_YMD=${YMD}")
            echo "Meal response (${YMD}): $(echo "$RES" | head -c 300)" >&2
            local DDISH=$(echo "$RES" | jq -r \
              '.mealServiceDietInfo[1].row[0].DDISH_NM // ""' 2>/dev/null)
            if [ -z "$DDISH" ]; then echo "null"; return; fi
            # 알레르기 코드 (1.2.3) 제거 후 <br/> 분할 → JSON 배열
            echo "$DDISH" \
              | sed 's/([0-9.]*[0-9])//g' \
              | jq -Rs 'split("<br/>") | map(gsub("^\\s+|\\s+$";"")) | map(select(. != ""))'
          }

          YESTERDAY_MENUS=$(fetch_menus "$YESTERDAY")
          TODAY_MENUS=$(fetch_menus "$TODAY")
          TOMORROW_MENUS=$(fetch_menus "$TOMORROW")
          [ -z "$YESTERDAY_MENUS" ] && YESTERDAY_MENUS="null"
          [ -z "$TODAY_MENUS" ]    && TODAY_MENUS="null"
          [ -z "$TOMORROW_MENUS" ] && TOMORROW_MENUS="null"
          echo "YESTERDAY_MENUS=${YESTERDAY_MENUS}"
          echo "TODAY_MENUS=${TODAY_MENUS}"
          echo "TOMORROW_MENUS=${TOMORROW_MENUS}"

          UPDATED=$(TZ=Asia/Seoul date +"%Y-%m-%dT%H:%M:%S+09:00")
          jq -cn \
            --arg yesterday "$YESTERDAY" --arg today "$TODAY" --arg tomorrow "$TOMORROW" \
            --argjson ym "$YESTERDAY_MENUS" --argjson tm "$TODAY_MENUS" --argjson dm "$TOMORROW_MENUS" \
            --arg updated "$UPDATED" \
            '{yesterday:{date:$yesterday,menus:$ym},today:{date:$today,menus:$tm},tomorrow:{date:$tomorrow,menus:$dm},updatedAt:$updated}' \
            > meal.json
          echo "meal.json:"; cat meal.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meal.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update meal data [skip ci]"
          git pull --rebase && git push
