<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#f6f6f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <title>등하원 시간표</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
  /* ────────────────────────────────────────────────
     Design tokens
     ──────────────────────────────────────────────── */
  :root {
    --bg: #f6f6f7;
    --bg-elev: #ffffff;
    --bg-sunken: #ececee;
    --fg: #121214;
    --fg-2: #4b4b53;
    --fg-3: #8a8a94;
    --fg-4: #b4b4bc;
    --line: rgba(18, 18, 20, 0.08);
    --line-strong: rgba(18, 18, 20, 0.14);
    --rail: #d9d9de;
    --now: #ef4444;
    --now-soft: rgba(239, 68, 68, 0.12);
    --glow: #f59e0b; /* 다가올 카드 글로우 (기존 앱과 동일한 앰버) */

    --shadow-1: 0 1px 2px rgba(18,18,20,0.04), 0 1px 1px rgba(18,18,20,0.03);
    --shadow-2: 0 2px 6px rgba(18,18,20,0.06), 0 8px 24px -12px rgba(18,18,20,0.10);

    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-pill: 999px;

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --t-fast: 160ms var(--ease);
    --t-base: 240ms var(--ease);

    /* 활동별 색 (라이트) */
    --c-school:  #2563eb;
    --c-kinder:  #d97706;
    --c-english: #7c3aed;
    --c-piano:   #db2777;
    --c-soccer:  #16a34a;
    --c-science: #0891b2;
    --c-froebel: #ea580c;
    --c-baduk:   #57534e;
    --c-art:     #e11d48;
    --c-meal:    #0d9488;

    /* 미세먼지 등급 */
    --aq-good: #0ea5e9;
    --aq-moderate: #22c55e;
    --aq-bad: #f97316;
    --aq-very-bad: #ef4444;

    --tint-alpha: 10%;
    --tint-alpha-strong: 14%;
  }


  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'tnum' 1, 'ss05' 1;
  }

  button { font: inherit; color: inherit; }

  .wrapper {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  /* ────────────────────────────────────────────────
     Header
     ──────────────────────────────────────────────── */
  .header {
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.1;
    white-space: nowrap;
  }
  .header h1 .dow { color: var(--fg-3); font-weight: 700; }
  .header h1 .today-tag {
    display: inline-block;
    vertical-align: middle;
    margin-left: 6px;
    font-size: 0.6875rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 3px 7px;
    border-radius: var(--r-pill);
    background: var(--now);
    color: #fff;
    transform: translateY(-2px);
  }

  /* 날씨 스트립 */
  .weather {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 7px 12px 7px 10px;
    border-radius: var(--r-md);
    background: var(--bg-elev);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-1);
    white-space: nowrap;
    min-height: 42px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .weather > :not(.weather-skeleton) { opacity: 0; transition: opacity 400ms ease; }
  .weather.loaded > :not(.weather-skeleton) { opacity: 1; }
  .weather-skeleton { color: var(--fg-4); font-weight: 500; }
  .weather.loaded .weather-skeleton { display: none; }
  .weather-main { display: flex; align-items: center; gap: 4px; }
  .weather-icon { display: flex; color: var(--fg-2); }
  .weather-icon svg { width: 22px; height: 22px; }
  .weather-temp {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .weather-range { display: flex; gap: 6px; }
  .weather-high { color: #ef4444; }
  .weather-low { color: #3b82f6; }
  .dust {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 10px;
    border-left: 1px solid var(--line);
    color: var(--fg-3);
    font-weight: 600;
  }
  .dust[hidden] { display: none; }
  .dust-item { display: inline-flex; align-items: center; gap: 4px; }
  .dust-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-4); }
  .dust-item[data-grade="good"] .dust-dot { background: var(--aq-good); }
  .dust-item[data-grade="moderate"] .dust-dot { background: var(--aq-moderate); }
  .dust-item[data-grade="bad"] .dust-dot { background: var(--aq-bad); }
  .dust-item[data-grade="very-bad"] .dust-dot { background: var(--aq-very-bad); }
  .dust-item[data-grade="bad"], .dust-item[data-grade="very-bad"] { color: var(--fg); font-weight: 800; }
  .weather-updated {
    margin-left: auto;
    font-size: 0.625rem;
    color: var(--fg-4);
    font-weight: 500;
  }

  /* ────────────────────────────────────────────────
     Sticky tabs
     ──────────────────────────────────────────────── */
  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 30;
    margin: 0 -16px;
    padding: max(14px, env(safe-area-inset-top)) 16px 8px;
    background: rgba(246, 246, 247, 0.86);
    background: color-mix(in srgb, var(--bg) 84%, transparent);
    -webkit-backdrop-filter: saturate(160%) blur(16px);
    backdrop-filter: saturate(160%) blur(16px);
    border-bottom: 1px solid transparent;
    transition: border-color var(--t-base);
  }
  .sticky-top.scrolled { border-bottom-color: var(--line); }


  /* 요일 세그먼트 */
  .day-tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    padding: 4px;
    background: var(--bg-sunken);
    border-radius: var(--r-md);
    position: relative;
  }
  .day-tab {
    position: relative;
    min-height: 50px;
    border: none;
    background: transparent;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    color: var(--fg-3);
    transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast);
    -webkit-tap-highlight-color: transparent;
  }
  .day-tab .d { font-size: 0.75rem; font-weight: 600; line-height: 1; }
  .day-tab .n { font-size: 1.0625rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .day-tab:active { transform: scale(0.96); }
  .day-tab.active {
    background: var(--bg-elev);
    color: var(--fg);
    box-shadow: var(--shadow-1);
  }
  .day-tab.today::after {
    content: '';
    position: absolute;
    bottom: 6px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--now);
  }
  .day-tab.today .d { color: var(--now); }

  /* ────────────────────────────────────────────────
     Content
     ──────────────────────────────────────────────── */
  .content {
    padding-top: 16px;
    transition: opacity 150ms ease, transform 150ms ease;
  }
  .content.switching { opacity: 0; transform: translateY(6px); }

  .section-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--fg-3);
    letter-spacing: 0.01em;
    margin: 0 2px 8px;
  }
  .section-label svg { width: 13px; height: 13px; }

  /* 다음 일정 (오늘만) */
  .next-up {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  #nextUpSlot:not(:empty) { padding-top: 12px; }
  #nextUpSlot .section-label { margin-bottom: 6px; }
  .next-card {
    position: relative;
    padding: 12px 12px 12px 14px;
    border-radius: var(--r-md);
    background: var(--bg-elev);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-1);
    overflow: hidden;
    min-height: 92px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .next-card::before {
    content: '';
    position: absolute;
    left: 0; top: 10px; bottom: 10px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--fg);
  }
  .next-card.done { opacity: 0.7; }
  .next-card.done::before { background: var(--fg-4); }
  .next-who {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.75rem; font-weight: 700; color: var(--fg-3);
  }
  .next-eta {
    margin-left: auto;
    font-size: 0.6875rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: var(--r-pill);
    background: var(--bg-sunken);
    color: var(--fg-2);
    white-space: nowrap;
  }
  .next-eta.soon { background: var(--now-soft); color: var(--now); }
  .next-time {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .next-time small { font-size: 0.8125rem; font-weight: 600; color: var(--fg-3); margin-right: 3px; letter-spacing: 0; }
  .next-what {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--fg-2);
    min-width: 0;
  }
  .next-what .ev-icon { width: 20px; height: 20px; border-radius: 6px; }
  .next-what .ev-icon svg { width: 12px; height: 12px; }
  .next-what span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next-detail {
    font-size: 0.6875rem;
    color: var(--fg-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 급식 */
  .meal {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px;
    align-items: start;
    padding: 11px 14px 10px;
    margin-bottom: 18px;
    border-radius: var(--r-md);
    background: var(--bg-elev);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-1);
  }
  .meal .ev-icon { --accent: var(--c-meal); width: 32px; height: 32px; }
  .meal-head {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 0.8125rem; font-weight: 700; line-height: 1.25;
  }
  .meal-head .date { color: var(--fg-3); font-weight: 600; font-size: 0.75rem; }
  .meal-head .school { margin-left: auto; font-size: 0.6875rem; font-weight: 600; color: var(--fg-3); }
  .meal-menus {
    display: flex; flex-wrap: wrap; gap: 4px 6px;
    margin-top: 5px;
  }
  .meal-menus span {
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.3;
    color: var(--fg-2);
    padding: 2px 8px;
    border-radius: var(--r-pill);
    background: var(--bg-sunken);
    word-break: keep-all;
  }

  /* ────────────────────────────────────────────────
     Timeline
     ──────────────────────────────────────────────── */
  .tl-head {
    display: grid;
    grid-template-columns: 1fr var(--rail-w) 1fr;
    align-items: center;
    margin-bottom: 10px;
  }
  .child-chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 0.9375rem; font-weight: 800; letter-spacing: -0.02em;
  }
  .child-chip.right { justify-self: end; flex-direction: row-reverse; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 800; color: #fff;
    letter-spacing: 0;
  }
  .avatar.yoonwoo { background: linear-gradient(135deg, #2563eb, #7c3aed); }
  .avatar.jun { background: linear-gradient(135deg, #f59e0b, #ef4444); }

  .timeline {
    --rail-w: 72px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 6px 0 8px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 2px;
    margin-left: -1px;
    background: var(--rail);
    border-radius: 1px;
    pointer-events: none;
  }

  .tl-row {
    display: grid;
    grid-template-columns: 1fr var(--rail-w) 1fr;
    align-items: stretch;
    animation: rowIn 320ms var(--ease) both;
    animation-delay: calc(var(--i, 0) * 28ms);
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  .tl-time {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 6px 4px;
    align-self: center;
    z-index: 2;
  }
  .tl-time .pill {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 6px;
    border-radius: 10px;
    background: var(--bg);
    line-height: 1;
  }
  .tl-time .ampm { font-size: 0.5625rem; font-weight: 700; color: var(--fg-3); letter-spacing: 0.04em; }
  .tl-time .hm { font-size: 0.9375rem; font-weight: 800; letter-spacing: -0.03em; margin-top: 2px; }
  .tl-time .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--rail);
    border: 2px solid var(--bg);
    margin-top: 2px;
    box-sizing: content-box;
  }
  .tl-row.is-next .tl-time .dot { background: var(--fg); }

  .tl-cell { min-width: 0; display: flex; }
  .tl-cell.left { justify-content: flex-end; padding-right: 2px; }
  .tl-cell.right { justify-content: flex-start; padding-left: 2px; }

  .ev {
    --accent: var(--fg-3);
    position: relative;
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 10px 10px 10px 10px;
    box-shadow: var(--shadow-1);
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 8px;
    row-gap: 3px;
    align-items: start;
    transition: opacity var(--t-base), box-shadow var(--t-base), transform var(--t-fast), filter var(--t-base);
    -webkit-tap-highlight-color: transparent;
  }
  .ev:active { transform: scale(0.985); }
  .ev.leave { background: #fbfbfc; background: color-mix(in srgb, var(--bg-elev) 70%, var(--bg)); }

  .ev-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(18, 18, 20, 0.06);
    background: color-mix(in srgb, var(--accent) var(--tint-alpha-strong), transparent);
    color: var(--accent);
    flex-shrink: 0;
    grid-row: 1 / span 2;
  }
  .ev-icon svg { width: 15px; height: 15px; }
  .ev.leave .ev-icon { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 38%, transparent); }

  .ev-main {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    min-width: 0;
  }
  .ev-name {
    font-size: 0.875rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.25;
    min-width: 0;
    word-break: keep-all;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ev-main { align-items: flex-start; }
  .ev-badge {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 0.625rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 2px 6px;
    border-radius: var(--r-pill);
    white-space: nowrap;
    flex-shrink: 0;
    line-height: 1.2;
  }
  .ev-badge svg { width: 9px; height: 9px; }
  .ev.arrive .ev-badge {
    background: var(--fg);
    color: #fff;
  }
  .ev.leave .ev-badge {
    background: transparent;
    color: var(--fg-2);
    box-shadow: inset 0 0 0 1.5px var(--line-strong);
  }
  .ev-detail {
    grid-column: 2;
    font-size: 0.6875rem;
    color: var(--fg-3);
    line-height: 1.35;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .ev-detail .warn { color: var(--now); font-weight: 700; }

  /* 활동별 색 */
  .ev[data-type="school"]  { --accent: var(--c-school); }
  .ev[data-type="kinder"]  { --accent: var(--c-kinder); }
  .ev[data-type="english"] { --accent: var(--c-english); }
  .ev[data-type="piano"]   { --accent: var(--c-piano); }
  .ev[data-type="soccer"]  { --accent: var(--c-soccer); }
  .ev[data-type="science"] { --accent: var(--c-science); }
  .ev[data-type="froebel"] { --accent: var(--c-froebel); }
  .ev[data-type="baduk"]   { --accent: var(--c-baduk); }
  .ev[data-type="art"]     { --accent: var(--c-art); }

  /* 상태: 지난 일정 */
  .tl-row.is-past .ev { opacity: 0.42; filter: saturate(0.2); box-shadow: none; }
  .tl-row.is-past .tl-time { opacity: 0.45; }

  /* 상태: 다음 일정 */
  .tl-row.is-next .ev {
    border-color: var(--glow);
    box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25), 0 0 12px 3px rgba(245, 158, 11, 0.35), var(--shadow-2);
    animation: nextPulse 2s ease-in-out infinite;
  }
  @keyframes nextPulse {
    0%, 100% { box-shadow: 0 0 4px 1px rgba(245, 158, 11, 0.15), var(--shadow-2); }
    50%      { box-shadow: 0 0 20px 6px rgba(245, 158, 11, 0.55), 0 0 8px 3px rgba(245, 158, 11, 0.30), var(--shadow-2); }
  }
  .ev-eta {
    grid-column: 2;
    font-size: 0.6875rem;
    font-weight: 800;
    color: var(--now);
    letter-spacing: -0.01em;
  }

  /* 현재 시각 표시선 */
  .now-line {
    position: relative;
    height: 24px;
    margin: -4px 0;
    z-index: 5;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .now-line::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    margin-top: -1px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--now) 12%, var(--now) 88%, transparent);
    opacity: 0.9;
  }
  .now-label {
    position: relative;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px 3px 7px;
    border-radius: var(--r-pill);
    background: var(--now);
    color: #fff;
    font-size: 0.8125rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    box-shadow: 0 2px 8px rgba(239,68,68,0.35);
    white-space: nowrap;
  }
  .now-label .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    animation: nowPulse 2s ease-in-out infinite;
  }
  @keyframes nowPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.6); opacity: 0.6; }
  }

  /* 빈 상태 */
  .empty {
    text-align: center;
    padding: 56px 20px;
    color: var(--fg-3);
  }
  .empty svg { width: 36px; height: 36px; color: var(--fg-4); margin-bottom: 10px; }
  .empty p { font-size: 0.875rem; font-weight: 600; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .footer-note {
    margin-top: 28px;
    text-align: center;
    font-size: 0.6875rem;
    color: var(--fg-4);
    font-weight: 500;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
  }

  /* ────────────────────────────────────────────────
     Responsive
     ──────────────────────────────────────────────── */
  @media (max-width: 420px) {
    .header h1 { font-size: 1.5rem; }
    .weather { gap: 8px; padding: 6px 10px 6px 8px; }
    .timeline { --rail-w: 60px; }

const todayIdx = new Date().getDay();

// ─── Helpers ───
function isToday() {
  const d = new Date().getDay();
  if (d < 1 || d > 5) return false;
  return currentDay === DAYS[d - 1];
}
function nowMinutes() { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
function nowLabel() {
  const m = nowMinutes(); const h = Math.floor(m / 60), mm = m % 60;
  return (h % 12 || 12) + ':' + String(mm).padStart(2, '0');
}
function parseTime(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function splitTime(t) {
  const [hStr, mStr] = t.split(':');
  const h = parseInt(hStr, 10);
  return { ampm: h >= 12 ? '오후' : '오전', hm: (h > 12 ? h - 12 : (h === 0 ? 12 : h)) + ':' + mStr };
}
function formatTime(t) { const s = splitTime(t); return s.ampm + ' ' + s.hm; }
function formatEta(diffMin) {
  if (diffMin <= 0) return '지금';
  if (diffMin < 60) return diffMin + '분 후';
  const h = Math.floor(diffMin / 60), m = diffMin % 60;
  return m ? `${h}시간 ${m}분 후` : `${h}시간 후`;
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// 이번 주(주말이면 다음 주) 월~금 날짜
function weekDates() {
  const now = new Date();
  const dow = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((dow + 6) % 7) + (dow === 0 || dow === 6 ? 7 : 0));
  return DAYS.map((_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
}

// ─── Header ───
function renderHeader() {
  const dates = weekDates();
  const sel = dates[DAYS.indexOf(currentDay)];
  const now = new Date();
  const sameDay = sel.toDateString() === now.toDateString();
  const h1 = document.getElementById('headerDate');
  h1.innerHTML = `${sel.getMonth() + 1}월 ${sel.getDate()}일 <span class="dow">${currentDay}요일</span>${sameDay ? '<span class="today-tag">오늘</span>' : ''}`;
}

// ─── Day tabs ───
function renderDays() {
  const dates = weekDates();

  document.getElementById('dayTabs').innerHTML = DAYS.map((d, i) => {
    const isToday = dates[i].toDateString() === now.toDateString();
    return `<button class="day-tab ${d === currentDay ? 'active' : ''} ${isToday ? 'today' : ''}" role="tab"
      aria-selected="${d === currentDay}" aria-label="${d}요일 ${dates[i].getDate()}일" onclick="selectDay('${d}')">
      <span class="d">${d}</span><span class="n">${dates[i].getDate()}</span>
    </button>`;
  }).join('');
}

function selectDay(day) {
  if (day === currentDay) return;
  currentDay = day;
  _scrollPending = true;
  document.querySelectorAll('.day-tab').forEach((btn, i) => {
    const active = DAYS[i] === day;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', active);
  });
  const content = document.getElementById('content');
  content.classList.add('switching');
  setTimeout(() => { render(); content.classList.remove('switching'); }, 150);
  renderHeader();
}

function buildEvent(ev) {
  return `<article class="ev ${ev.dir}" data-type="${ev.type}">
    <span class="ev-icon">${svg(ev.type)}</span>
    <div class="ev-main">
      <span class="ev-name">${escapeHtml(ev.name)}</span>

    </div>
    ${ev.detail ? `<div class="ev-detail">${escapeHtml(ev.detail)}</div>` : ''}
  </article>`;
}

// ─── Next up ───
function buildNextUp(evY, evJ) {
  if (!isToday()) return '';
  const now = nowMinutes();
  const card = (child, events) => {
    const next = events.find(e => parseTime(e.time) >= now);
    const who = `<span class="avatar ${child}">${DATA[child].short[0]}</span>${DATA[child].short}`;
    if (!next) {
      return `<div class="next-card done">
        <div class="next-who">${who}</div>
        <div class="next-time" style="font-size:1rem;color:var(--fg-3)">오늘 일정 끝</div>
        <div class="next-detail">${events.length ? '모두 ' + events.length + '개 완료' : '일정 없음'}</div>
      </div>`;
    }
    const diff = parseTime(next.time) - now;
    const t = splitTime(next.time);
    return `<div class="next-card" style="--accent:var(--c-${next.type})">
      <div class="next-who">${who}<span class="next-eta ${diff <= 15 ? 'soon' : ''}">${formatEta(diff)}</span></div>
      <div class="next-time"><small>${t.ampm}</small>${t.hm}</div>
      <div class="next-what"><span class="ev-icon">${svg(next.type)}</span><span class="t">${escapeHtml(next.name)}${next.name.includes(next.badge) ? '' : ' ' + escapeHtml(next.badge)}</span></div>
      ${next.detail ? `<div class="next-detail">${escapeHtml(next.detail)}</div>` : ''}
    </div>`;
  };
  return `<div class="section-label">${svg('clock')}다음 일정</div>
    <section class="next-up" aria-label="다음 일정">${card('yoonwoo', evY)}${card('jun', evJ)}</section>`;
}

// ─── Meal ───
function findMealForDay() {
  if (!_mealData) return null;
  const entries = [_mealData.yesterday, _mealData.today, _mealData.tomorrow].filter(e => e && e.date);
  for (const entry of entries) {
    const ds = entry.date;
    const dow = new Date(+ds.slice(0, 4), +ds.slice(4, 6) - 1, +ds.slice(6, 8)).getDay();
    const label = dow >= 1 && dow <= 5 ? DAYS[dow - 1] : null;
    if (label === currentDay) return entry;
  }
  return null;
}
function buildMeal() {
  const meal = findMealForDay();
  if (!meal || !meal.menus || !meal.menus.length) return '';
  return `<section class="meal" aria-label="급식 정보">
    <span class="ev-icon">${svg('meal')}</span>
    <div>
      <div class="meal-head">급식 <span class="date">${+meal.date.slice(4, 6)}/${+meal.date.slice(6, 8)}</span><span class="school">한아람초</span></div>
      <div class="meal-menus">${meal.menus.map(m => `<span>${escapeHtml(m)}</span>`).join('')}</div>
    </div>
  </section>`;
}

function render() {
  const evY = (DATA.yoonwoo.schedule[currentDay] || []).map(e => ({ ...e, child: 'yoonwoo' }));
  const evJ = (DATA.jun.schedule[currentDay] || []).map(e => ({ ...e, child: 'jun' }));
  const area = document.getElementById('content');

  const slot = document.getElementById('nextUpSlot');
  if (evY.length === 0 && evJ.length === 0) {
    _rows = [];
    slot.innerHTML = '';
    area.innerHTML = buildMeal() + `<div class="empty">${svg('calOff')}<p>이 날은 일정이 없어요</p></div>`;
    return;
  }

  // 시간순 병합 → 같은 시각은 한 행에 좌/우 배치
  const all = [...evY, ...evJ].sort((a, b) => parseTime(a.time) - parseTime(b.time));
  const rows = [];
  let i = 0;
  while (i < all.length) {
    const t = parseTime(all[i].time);
    let row = { time: all[i].time, left: null, right: null };
    while (i < all.length && parseTime(all[i].time) === t) {
      const ev = all[i];
      const side = ev.child === 'yoonwoo' ? 'left' : 'right';
      if (row[side]) { rows.push(row); row = { time: ev.time, left: null, right: null }; }
      row[side] = ev;
      i++;
    }
    rows.push(row);
  }
  _rows = rows;

  slot.innerHTML = buildNextUp(evY, evJ);
  let html = buildMeal();

  html += `<div class="tl-head" style="--rail-w:72px">
    <span class="child-chip"><span class="avatar yoonwoo">윤</span>${DATA.yoonwoo.label}</span>
    <span></span>
    <span class="child-chip right"><span class="avatar jun">준</span>${DATA.jun.label}</span>
  </div>`;

  html += `<section class="timeline" id="timeline" aria-label="${currentDay}요일 시간표">`;
  rows.forEach((row, idx) => {
    const t = splitTime(row.time);
    html += `<div class="tl-row" style="--i:${idx}" data-min="${parseTime(row.time)}">
      <div class="tl-cell left">${row.left ? buildEvent(row.left) : ''}</div>
      <div class="tl-time"><div class="pill"><span class="ampm">${t.ampm}</span><span class="hm">${t.hm}</span></div><span class="dot"></span></div>
      <div class="tl-cell right">${row.right ? buildEvent(row.right) : ''}</div>
    </div>`;
  });
  html += `</section>`;

  area.innerHTML = html;

  updateNow(false);
  const doScroll = _scrollPending;
  _scrollPending = false;
  document.fonts.ready.then(() => requestAnimationFrame(() => updateNow(doScroll)));
}

// 현재 시각선 + 지난/다음 상태 갱신
function updateNow(scrollToCenter) {
  const tl = document.getElementById('timeline');
  if (!tl) return;
  const existing = tl.querySelector('.now-line');
  if (existing) existing.remove();

  const rowEls = Array.from(tl.querySelectorAll('.tl-row'));
  rowEls.forEach(r => { r.classList.remove('is-past', 'is-next'); r.querySelectorAll('.ev-eta').forEach(e => e.remove()); });

  if (!isToday() || rowEls.length === 0) return;

  const now = nowMinutes();
  const times = rowEls.map(r => +r.dataset.min);

  // 지난 행 / 다음 행 표시
  let nextIdx = -1;
  rowEls.forEach((r, i) => {
    if (times[i] < now) r.classList.add('is-past');
    else if (nextIdx === -1) nextIdx = i;
  });
  if (nextIdx !== -1) {
    const r = rowEls[nextIdx];
    r.classList.add('is-next');
    const diff = times[nextIdx] - now;
    r.querySelectorAll('.ev').forEach(ev => {
      const eta = document.createElement('div');
      eta.className = 'ev-eta';
      eta.textContent = formatEta(diff);
      ev.appendChild(eta);
    });
  }

  // 일정 범위 ±60분 벗어나면 시각선 비표시
  if (now < times[0] - 60 || now > times[times.length - 1] + 60) return;

  // 다음 행 바로 앞에 독립된 행으로 삽입 → 카드와 겹치지 않음
  const line = document.createElement('div');
  line.className = 'now-line';
  line.innerHTML = `<span class="now-label"><span class="pulse"></span>현재 ${nowLabel()}</span>`;
  if (nextIdx !== -1) tl.insertBefore(line, rowEls[nextIdx]);
  else tl.appendChild(line);

  // 현재선 펄스와 다가올 카드 글로우를 같은 프레임에서 재시작 → 박자 동기화
  const synced = [line.querySelector('.pulse'), ...tl.querySelectorAll('.tl-row.is-next .ev')];
  synced.forEach(el => { el.style.animation = 'none'; });
  void tl.offsetHeight; // reflow
  synced.forEach(el => { el.style.animation = ''; });

  if (scrollToCenter) line.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// 다음 일정 섹션만 갱신 (매분)
function refreshNextUp() {
  const sec = document.querySelector('.next-up');
  if (!sec) return;
  const evY = (DATA.yoonwoo.schedule[currentDay] || []);
  const evJ = (DATA.jun.schedule[currentDay] || []);
  const tmp = document.createElement('div');
  tmp.innerHTML = buildNextUp(evY, evJ);
  const fresh = tmp.querySelector('.next-up');
  if (fresh) sec.innerHTML = fresh.innerHTML;
}

// ─── 매분 정각 동기화 / 자정 새로고침 ───
function tick() {
  if (new Date().getDate() !== _startDate) { location.reload(); return; }
  updateNow(false);
  refreshNextUp();
  renderHeader();
}
function scheduleMinuteSync() {
  const ms = (60 - new Date().getSeconds()) * 1000;
  setTimeout(() => { tick(); setInterval(tick, 60000); }, ms);
}
scheduleMinuteSync();
window.addEventListener('resize', () => updateNow(false));

// 스크롤 시 헤더 하단 선 표시
const _sticky = document.getElementById('stickyTop');
window.addEventListener('scroll', () => _sticky.classList.toggle('scrolled', window.scrollY > 4), { passive: true });

renderDays();
renderHeader();
render();

// ─── Weather ───
const WI = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  cloudSun: '<path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>',
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  drizzle: '<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 19v1"/><path d="M8 14v1"/><path d="M16 19v1"/><path d="M16 14v1"/><path d="M12 21v1"/><path d="M12 16v1"/>',
  rain: '<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>',
  snow: '<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h.01"/><path d="M8 19h.01"/><path d="M12 17h.01"/><path d="M12 21h.01"/><path d="M16 15h.01"/><path d="M16 19h.01"/>',
};
const wsvg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

function getWeatherInfo(sky, pty) {
  if (pty == 1 || pty == 5) return { icon: wsvg(WI.rain), label: pty == 5 ? '빗방울' : '비' };
  if (pty == 2 || pty == 6) return { icon: wsvg(WI.snow), label: pty == 6 ? '빗방울눈날림' : '비/눈' };
  if (pty == 3 || pty == 7) return { icon: wsvg(WI.snow), label: pty == 7 ? '눈날림' : '눈' };
  if (pty == 4) return { icon: wsvg(WI.drizzle), label: '소나기' };
  if (sky == 1) return { icon: wsvg(WI.sun), label: '맑음' };
  if (sky == 3) return { icon: wsvg(WI.cloudSun), label: '구름많음' };
  if (sky == 4) return { icon: wsvg(WI.cloud), label: '흐림' };
  return { icon: wsvg(WI.cloud), label: '날씨' };
}

function getDustGrade(pm, type) {
  if (pm == null || isNaN(pm)) return null;
  const th = type === 'pm10' ? [30, 80, 150] : [15, 35, 75];
  const grades = [
    { key: 'good', label: '좋음' }, { key: 'moderate', label: '보통' },
    { key: 'bad', label: '나쁨' }, { key: 'very-bad', label: '매우나쁨' },
  ];
  for (let i = 0; i < th.length; i++) if (pm <= th[i]) return grades[i];
  return grades[3];
}

function renderDust(data) {
  const wrap = document.getElementById('dust');
  const g10 = getDustGrade(data.pm10, 'pm10');
  const g25 = getDustGrade(data.pm25, 'pm25');
  if (!g10 && !g25) { wrap.hidden = true; return; }
  wrap.hidden = false;
  const apply = (id, g, name) => {
    const el = document.getElementById(id);
    el.hidden = !g;
    if (!g) return;
    el.dataset.grade = g.key;
    el.title = `${name} ${g.label}`;
    // 나쁨 이상이면 글자로도 등급을 노출
    el.querySelector('.dust-txt').textContent = (g.key === 'bad' || g.key === 'very-bad') ? `${name} ${g.label}` : name;
  };
  apply('dust10', g10, '미세');
  apply('dust25', g25, '초미세');
  const parts = [];
  if (g10) parts.push('미세먼지 ' + g10.label + (data.pm10 != null ? ' ' + data.pm10 + 'µg' : ''));
  if (g25) parts.push('초미세먼지 ' + g25.label + (data.pm25 != null ? ' ' + data.pm25 + 'µg' : ''));
  return parts.join(', ');
}

function renderWeather(data) {
  const info = getWeatherInfo(data.sky, data.pty);
  document.getElementById('weatherIcon').innerHTML = info.icon;
  document.getElementById('weatherTemp').textContent = data.temp + '°';
  document.getElementById('weatherLow').textContent = data.min != null ? data.min + '°' : '--';
  document.getElementById('weatherHigh').textContent = data.max != null ? data.max + '°' : '--';
  const dustSr = renderDust(data) || '';
  const minTxt = data.min != null ? data.min + '도' : '정보없음';
  const maxTxt = data.max != null ? data.max + '도' : '정보없음';
  document.getElementById('weatherSr').textContent =
    `${info.label}, 현재 ${data.temp}도, 최저 ${minTxt}, 최고 ${maxTxt}` + (dustSr ? ', ' + dustSr : '');
  document.getElementById('weather').classList.add('loaded');

  if (data.updatedAt) {
    const d = new Date(data.updatedAt);
    const h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
    const dh = h % 12 || 12;
    document.getElementById('weatherUpdated').textContent = `${h >= 12 ? '오후' : '오전'} ${dh}:${m} 기준`;
  }
}

async function loadWeather() {
  try {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 5000);
    const res = await fetch('https://pickup-proxy.jeonghun-ryu.workers.dev/weather.json', { signal: controller.signal });
    clearTimeout(tid);
    const data = await res.json();
    localStorage.setItem('weather_cache_v2', JSON.stringify({ data, ts: Date.now() }));
    renderWeather(data);
  } catch (e) {
    const cached = localStorage.getItem('weather_cache_v2');
    if (cached) renderWeather(JSON.parse(cached).data);
    else document.querySelector('.weather-skeleton').textContent = '날씨 정보를 가져오지 못했어요';
  }
}

// 이전 버전 캐시 정리
localStorage.removeItem('weather_cache');
localStorage.removeItem('meal_cache');

loadWeather();
setInterval(loadWeather, 10 * 60 * 1000);

async function loadMeal() {
  const cached = localStorage.getItem('meal_cache_v2');
  try {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 5000);
    const res = await fetch('https://pickup-proxy.jeonghun-ryu.workers.dev/meal.json', { signal: controller.signal });
    clearTimeout(tid);
    const data = await res.json();
    localStorage.setItem('meal_cache_v2', JSON.stringify({ data }));
    _mealData = data; render();
  } catch (e) {
    if (cached) { _mealData = JSON.parse(cached).data; render(); }
  }
}
loadMeal();

// ─── Swipe navigation ───
let _tx = 0, _ty = 0;
const _swipeAreas = [document.getElementById('content'), document.getElementById('nextUpSlot')];
_swipeAreas.forEach(el => el.addEventListener('touchstart', e => { _tx = e.touches[0].clientX; _ty = e.touches[0].clientY; }, { passive: true }));
_swipeAreas.forEach(el => el.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - _tx;
  const dy = e.changedTouches[0].clientY - _ty;
  const w = window.innerWidth;
  if (_tx < w * 0.15 || _tx > w * 0.85) return; // 가장자리 제스처(브라우저 뒤로가기)와 충돌 방지
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const idx = DAYS.indexOf(currentDay);
    if (dx < 0 && idx < 4) selectDay(DAYS[idx + 1]);
    else if (dx > 0 && idx > 0) selectDay(DAYS[idx - 1]);
  }
}, { passive: true }));

// ─── Service Worker ───
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
