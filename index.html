<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <title>등하원 시간표</title>
  <script>(function(){if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')})()</script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
  :root {
    /* Base */
    --background: #ffffff;
    --foreground: #09090b;
    --muted: #f4f4f5;
    --muted-foreground: #71717a;
    --border: #e4e4e7;
    --ring: #18181b;
    --card: #ffffff;
    --card-foreground: #09090b;
    --primary: #18181b;
    --primary-foreground: #fafafa;
    --secondary: #f4f4f5;
    --secondary-foreground: #18181b;
    --accent: #f4f4f5;
    --accent-foreground: #18181b;
    --destructive: #ef4444;

    /* Type Scale */
    --text-xs: 0.6875rem;
    --text-sm: 0.8125rem;
    --text-base: 0.9375rem;
    --text-lg: 1.125rem;
    --text-xl: 1.25rem;

    /* Radius */
    --radius-sm: 8px;
    --radius-md: 12px;

    /* Spacing */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;

    /* Shadows */
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
    --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.04);
    --shadow-md: 0 4px 12px 0 rgb(0 0 0 / 0.06), 0 1px 3px 0 rgb(0 0 0 / 0.04);

    /* Transition */
    --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);

    /* Air Quality */
    --aq-good:      #38bdf8;
    --aq-moderate:  #22c55e;
    --aq-bad:       #f97316;
    --aq-very-bad:  #ef4444;

  }

  .dark {
    --background: #000000;
    --foreground: #fafafa;
    --muted: #171717;
    --muted-foreground: #a1a1aa;
    --border: #262626;
    --ring: #d4d4d8;
    --card: #1a1a1a;
    --card-foreground: #fafafa;
    --primary: #fafafa;
    --primary-foreground: #18181b;
    --secondary: #171717;
    --secondary-foreground: #fafafa;
    --accent: #171717;
    --accent-foreground: #fafafa;
    --destructive: #dc2626;

    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
    --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.4), 0 1px 2px -1px rgb(0 0 0 / 0.3);
    --shadow-md: 0 4px 12px 0 rgb(0 0 0 / 0.4), 0 1px 3px 0 rgb(0 0 0 / 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif;
    background: var(--background);
    color: var(--foreground);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrapper {
    max-width: 520px;
    margin: 0 auto;
    padding: var(--space-5) max(var(--space-5), env(safe-area-inset-right)) var(--space-8) max(var(--space-5), env(safe-area-inset-left));
    padding-top: max(var(--space-5), env(safe-area-inset-top));
    padding-bottom: max(var(--space-8), env(safe-area-inset-bottom));
  }

  /* Sticky top container */
  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--background);
  }

  /* Header */
  .header {
    padding: var(--space-2) 0 var(--space-3);
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    gap: var(--space-2);
    margin-bottom: 0;
  }

  .header-icon {
    width: 28px;
    height: 28px;
    background: var(--muted);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .header-icon svg { color: var(--muted-foreground); width: 16px; height: 16px; }

  .header h1 {
    font-size: var(--text-xl);
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--foreground);
  }

  .header .period {
    font-size: var(--text-sm);
    color: var(--muted-foreground);
    font-weight: 400;
    margin-left: 6px;
  }

  .header-subtitle {
    font-size: var(--text-xs);
    color: var(--muted-foreground);
    font-weight: 400;
    margin-top: 2px;
    min-height: 1em;
  }

  .weather-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    margin-left: auto;
    flex-shrink: 0;
  }

  .weather-group-row {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .weather-updated {
    font-size: var(--text-xs);
    color: var(--muted-foreground);
    font-weight: 400;
    text-align: right;
    margin-top: 2px;
  }

  /* Weather Widget */
  .weather-widget {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 4px 10px;
    background: transparent;
    border-radius: 999px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
    contain: layout style;
    white-space: nowrap;
    font-family: 'Geist', sans-serif;
    font-variant-numeric: tabular-nums;
  }

  .weather-widget.loaded { opacity: 1; }

  .weather-now {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .weather-icon {
    font-size: 1rem;
    line-height: 1;
    display: flex;
    align-items: center;
    color: var(--muted-foreground);
  }

  .weather-icon svg {
    width: 20px;
    height: 20px;
  }

  .weather-temp {
    font-size: var(--text-xl);
    font-weight: 600;
    color: var(--foreground);
    letter-spacing: -0.02em;
  }

  .weather-range {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0;
    margin-left: 6px;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.2;
  }

  .weather-high, .weather-low {
    display: flex;
    justify-content: space-between;
    min-width: 2.5em;
  }

  .weather-low { color: #3b82f6; }
  .weather-high { color: #ef4444; }

  /* Dust Widget — .weather-range와 동일 구조 */
  .dust-widget {
    margin-left: 1px;
    display: flex;
    align-items: center;
  }
  .dust-range {
    display: flex;
    flex-direction: column;
    gap: 0;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.2;
  }
  .dust-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dust-lbl { color: var(--muted-foreground); font-weight: 400; min-width: 3em; }
  .dust-face {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  @media (max-width: 420px) {
    .dust-range { font-size: 0.6875rem; }
  }
  @media (max-width: 360px) { .dust-widget { display: none; } }

  /* Day selector */
  .day-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: var(--space-3);
  }

  .meal-tag {
    font-size: var(--text-xs);
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--muted);
    color: var(--muted-foreground);
  }
  .side-meal-left {
    grid-column: 1;
    padding: 0 8px 0 0;
    position: relative;
    z-index: 1;
  }
  .side-meal-right {
    grid-column: 3;
    padding: 0 0 0 8px;
    position: relative;
    z-index: 1;
  }

  .day-selector {
    display: flex;
    background: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-1);
    gap: 2px;
    flex: 1;
  }

  .day-btn {
    flex: 1;
    min-height: 44px;
    padding: 8px 0;
    border: none;
    background: transparent;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: var(--text-sm);
    font-weight: 400;
    color: var(--muted-foreground);
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .day-btn:hover { color: var(--foreground); background: var(--accent); }

  .day-btn.active {
    background: var(--primary);
    color: var(--primary-foreground);
    font-weight: 600;
  }

  .summary-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 54px;
    padding: 2px 10px;
    border-radius: 6px;
    font-size: var(--text-xs);
    font-weight: 600;
    flex-shrink: 0;
    color: var(--background);
    letter-spacing: 0.03em;
  }

  .summary-badge-yoonwoo { background: var(--foreground); }
  .summary-badge-jun { background: var(--foreground); word-spacing: 0.25em; }

  /* Schedule area */
  .schedule-area {
    min-height: 120px;
    transition: opacity 150ms ease, transform 150ms ease;
  }
  .schedule-area.switching { opacity: 0; transform: translateY(4px); }

  /* Individual schedule cards */
  .schedule-list {
    display: flex;
    flex-direction: column;
  }

  .schedule-item {
    position: relative;
    padding-bottom: var(--space-2);
    animation: cardIn 0.28s var(--transition) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Connector between cards */
  .schedule-item:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 20px;
    bottom: 0;
    height: 8px;
    width: 0;
    border-left: 1.5px dotted #d4d4d8;
  }

  .event-card {
    background: var(--card);
    border: none;
    border-radius: var(--radius-md);
    padding: 14px 16px;
    transition: box-shadow var(--transition);
    border-left: 3px solid var(--border);
    box-shadow: var(--shadow);
  }

  .event-card:active {
    transform: scale(0.985);
  }

  @media (hover: hover) {
    .event-card:hover {
      box-shadow: var(--shadow-md);
    }
  }

  .event-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-1);
  }

  .event-time {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: var(--text-lg);
    color: var(--foreground);
    letter-spacing: -0.02em;
  }

  .event-badge {
    font-size: var(--text-xs);
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 6px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .badge-arrive {
    background: var(--muted-foreground);
    color: var(--background);
  }

  .badge-leave {
    background: transparent;
    border: 1.5px solid var(--muted-foreground);
    color: var(--muted-foreground);
  }

  .event-name {
    font-weight: 500;
    font-size: var(--text-base);
    color: var(--muted-foreground);
    letter-spacing: -0.01em;
  }

  .event-detail {
    font-size: var(--text-sm);
    color: var(--muted-foreground);
    margin-top: 1px;
  }

  .text-warn { color: var(--destructive); font-weight: 600; }

  /* Color assignments — border-left, badge 모두 foreground 통일 */

  /* Side by Side (함께보기) */
  .side-by-side {
    display: grid;
    grid-template-columns: 1fr var(--space-2) 1fr;
    row-gap: 12px;
    min-height: 120px;
    position: relative;
  }

  /* 타임라인 세로선: side-by-side 컨테이너에 배치 */
  .side-by-side::before,
  .side-by-side::after {
    content: '';
    position: absolute;
    top: 40px;
    bottom: 12px;
    width: 3px;
    background: var(--border);
    z-index: 0;
    pointer-events: none;
  }
  .side-by-side::before {
    left: calc(25% - 2px);
  }
  .side-by-side::after {
    left: calc(75% + 2px);
  }

  .side-col-name {
    text-align: center;
    padding: var(--space-2) 0;
    position: relative;
    z-index: 11;
  }

  .side-col-name .summary-badge {
    font-size: var(--text-base);
    padding: 2px 12px;
    min-width: 72px;
  }

  .side-cell, .side-cell-empty {
    position: relative;
    z-index: 1;
  }
  .side-cell-left, .side-cell-empty-left {
    grid-column: 1;
    padding: 0 8px 0 0;
  }
  .side-cell-right, .side-cell-empty-right {
    grid-column: 3;
    padding: 0 0 0 8px;
  }

  .side-divider {
    background: transparent;
  }

  /* Now indicator */
  .now-indicator {
    position: absolute;
    left: 0;
    right: 0;
    height: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .now-indicator-line {
    position: absolute;
    left: 8px;
    right: 8px;
    height: 2px;
    top: -1px;
    border-radius: 1px;
    background: #ef4444;
  }
  .now-indicator-dot {
    position: relative;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ef4444;
    border: 2.5px solid var(--background);
    z-index: 11;
    animation: dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 1px rgba(239,68,68,0.25); }
    50% { transform: scale(1.2); box-shadow: 0 0 0 6px rgba(239,68,68,0.15), 0 0 10px rgba(239,68,68,0.2); }
  }
  .side-card.is-past > * {
    opacity: 0.25;
    transition: opacity 300ms ease;
  }

  .side-card {
    position: relative;
    z-index: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 10px;
    min-height: 74px;
    border-left: 3px solid var(--foreground);
    box-shadow: var(--shadow-sm);
    transition: all 150ms ease;
  }

  @media (hover: hover) {
    .side-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
  }

  .side-card:active {
    transform: translateY(-1px) scale(0.985);
  }

  .side-card:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .side-card .event-time {
    font-size: var(--text-lg);
  }

  .side-card .event-name {
    font-size: var(--text-sm);
  }

  .side-card .event-detail {
    font-size: 0.72rem;
  }

  .side-card .event-badge {
    font-size: var(--text-xs);
    padding: 1px 6px;
  }


  /* Glow effect for next upcoming card */
  @keyframes cardGlow {
    0%, 100% { box-shadow: 0 0 4px 1px rgba(245, 158, 11, 0.15), var(--shadow-sm); }
    50% { box-shadow: 0 0 20px 6px rgba(245, 158, 11, 0.55), 0 0 8px 3px rgba(245, 158, 11, 0.3), var(--shadow-sm); }
  }
  .side-card.glow-next {
    animation: cardGlow 2s ease-in-out infinite;
    border-left-width: 4px;
  }


  /* Empty */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted-foreground);
  }
  .empty-state svg { margin-bottom: 10px; color: var(--border); }
  .empty-state p { font-size: var(--text-sm); font-weight: 500; }

  .relative-time {
    font-size: 0.625rem;
    color: var(--muted-foreground);
    font-weight: 400;
    margin-left: 4px;
  }


  /* Accessibility */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Theme toggle */
  .theme-toggle {
    border: none;
    background: var(--muted);
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background var(--transition);
  }
  .theme-toggle:hover { background: var(--accent); }
  .theme-toggle svg { width: 14px; height: 14px; }
  .theme-toggle .icon-sun { color: var(--foreground); opacity: 1; }
  .theme-toggle .icon-moon { color: var(--muted-foreground); opacity: 0.3; }
  .dark .theme-toggle .icon-sun { color: var(--muted-foreground); opacity: 0.3; }
  .dark .theme-toggle .icon-moon { color: var(--foreground); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Responsive */
  @media (max-width: 420px) {
    .wrapper { padding: var(--space-4) var(--space-4) var(--space-8); }
    .header h1 { font-size: var(--text-lg); }
    .event-time { font-size: 1rem; }
    .event-card { padding: var(--space-3) 14px; }
    .side-card { padding: var(--space-2); }
    .side-card .event-time { font-size: var(--text-base); }
    .side-card .event-name { font-size: 0.78rem; }
    .side-card .event-badge { font-size: 0.625rem; padding: 1px 5px; }
    .side-cell-left, .side-cell-empty-left, .side-meal-left { padding-right: 6px; padding-left: 6px; }
    .side-cell-right, .side-cell-empty-right, .side-meal-right { padding-left: 6px; padding-right: 6px; }
    .side-by-side::before { left: calc(25% - 1.5px); }
    .side-by-side::after { left: calc(75% - 1.5px); }
    .weather-widget { padding: 3px 8px; }
    .weather-temp { font-size: var(--text-lg); }
    .weather-icon svg { width: 18px; height: 18px; }
    .weather-range { font-size: 0.6875rem; margin-left: 4px; }
  }

  @media (max-width: 360px) {
    .weather-range { display: none; }
  }
  </style>
</head>
<body>
  <div class="wrapper">
  <div class="sticky-top">
  <header class="header">
    <div class="header-top">
      <div class="header-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      </div>
      <div style="flex:1;min-width:0">
        <h1>등하원 시간표</h1>
        <div class="header-subtitle" id="headerSubtitle"></div>
      </div>
      <div class="weather-group">
        <div class="weather-group-row">
          <aside class="weather-widget" id="weatherWidget" role="status" aria-label="현재 날씨" aria-live="polite" aria-atomic="true">
            <div class="weather-now">
              <span class="weather-icon" id="weatherIcon" aria-hidden="true"></span>
              <span class="weather-temp" id="weatherTemp"></span>
            </div>
            <div class="weather-range" id="weatherRange">
              <span class="weather-high"><span class="weather-arrow">↑</span><span id="weatherHigh"></span></span>
              <span class="weather-low"><span class="weather-arrow">↓</span><span id="weatherLow"></span></span>
            </div>
            <span class="sr-only" id="weatherSr"></span>
          </aside>
          <div class="dust-widget" id="dustWidget" role="status" aria-live="polite" hidden>
            <div class="dust-range">
              <span class="dust-row">
                <span class="dust-lbl">미세</span>
                <span class="dust-face" id="dustFace10" aria-hidden="true"></span>
              </span>
              <span class="dust-row">
                <span class="dust-lbl">초미세</span>
                <span class="dust-face" id="dustFace25" aria-hidden="true"></span>
              </span>
            </div>
            <span class="sr-only" id="dustSr"></span>
          </div>
        </div>
        <div class="weather-updated" id="weatherUpdated"></div>
      </div>
    </div>
  </header>

  <div class="day-row">
    <div class="day-selector" id="daySelector" role="tablist" aria-label="요일 선택"></div>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="테마 전환">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

let currentDay = '월';
let _sideRows = [];
let _mealData = null;
const todayIdx = new Date().getDay();
if (todayIdx >= 1 && todayIdx <= 5) currentDay = DAYS[todayIdx - 1];

function isToday() {
  const d = new Date().getDay();
  if (d < 1 || d > 5) return false;
  return currentDay === DAYS[d - 1];
}

function getCurrentMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function parseTime(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function formatTime(t) {
  const [hStr, mStr] = t.split(':');
  const h = parseInt(hStr);
  const prefix = h >= 12 ? '오후' : '오전';
  const displayH = h > 12 ? h - 12 : h;
  return prefix + ' ' + displayH + ':' + mStr;
}

function renderHeaderSubtitle() {
  const el = document.getElementById('headerSubtitle');
  if (!el) return;
  const now = new Date();
  const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
  const m = now.getMonth() + 1;
  const d = now.getDate();
  el.textContent = `${m}월 ${d}일 ${dayNames[now.getDay()]}요일`;
}

function selectDay(day) {
  if (day === currentDay) return;
  currentDay = day;
  document.querySelectorAll('.day-btn').forEach((btn, i) => {
    const isActive = DAYS[i] === day;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', isActive);
  });
  const area = document.getElementById('scheduleArea');
  area.classList.add('switching');
  setTimeout(() => {
    render();
    area.classList.remove('switching');
  }, 150);
  renderHeaderSubtitle();
}

function renderDays() {
  document.getElementById('daySelector').innerHTML = DAYS.map(d =>
    `<button class="day-btn ${d === currentDay ? 'active' : ''}" role="tab" aria-selected="${d === currentDay}" onclick="selectDay('${d}')">${d}</button>`
  ).join('');
}

function buildSideCard(ev, typeColorMap) {
  const badgeDot = ev.dir === 'arrive' ? '●' : '○';
  const badgeClass = ev.dir === 'arrive' ? 'badge-arrive' : 'badge-leave';
  const borderColor = (typeColorMap[ev.type] || 0) % 2 === 0 ? 'var(--foreground)' : '#8a8a8a';
  return `<div class="side-card" style="border-left-color:${borderColor}">
    <div class="event-card-header">
      <span class="event-time">${formatTime(ev.time)}</span>
      <span class="event-badge ${badgeClass}">${badgeDot} ${ev.badge}</span>
    </div>
    <div class="event-name">${ev.name}</div>
    ${ev.detail ? `<div class="event-detail">${ev.detail}</div>` : ''}
  </div>`;
}

function render() {
  renderBoth();
}

function renderBoth() {
  const evY = (DATA.yoonwoo.schedule[currentDay] || []).map(e => ({...e, child: 'yoonwoo'}));
  const evJ = (DATA.jun.schedule[currentDay] || []).map(e => ({...e, child: 'jun'}));
  const area = document.getElementById('scheduleArea');

  if (evY.length === 0 && evJ.length === 0) {
    area.innerHTML = `<div class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <p>이 날은 일정이 없습니다</p>
    </div>`;
    return;
  }

  // Merge and sort by time
  const all = [...evY, ...evJ].sort((a, b) => parseTime(a.time) - parseTime(b.time));

  // Group into rows: events at the same time should share a row
  const rows = [];
  let i = 0;
  while (i < all.length) {
    const t = parseTime(all[i].time);
    const row = { left: null, right: null };
    while (i < all.length && parseTime(all[i].time) === t) {
      if (all[i].child === 'yoonwoo') {
        if (row.left) {
          rows.push({...row});
          row.left = null;
          row.right = null;
        }
        row.left = all[i];
      } else {
        if (row.right) {
          rows.push({...row});
          row.left = null;
          row.right = null;
        }
        row.right = all[i];
      }
      i++;
    }
    rows.push(row);
  }

  function buildTypeColorMap(events) {
    const map = {};
    let idx = 0;
    events.forEach(ev => {
      if (!(ev.type in map)) map[ev.type] = idx++;
    });
    return map;
  }
  const leftColorMap = buildTypeColorMap(evY);
  const rightColorMap = buildTypeColorMap(evJ);

  let html = `<div class="side-by-side">`;

  // Header row
  html += '<div class="side-col-name" style="grid-column:1"><span class="summary-badge summary-badge-yoonwoo">최윤우</span></div>';
  html += '<div style="grid-column:2"></div>';
  html += '<div class="side-col-name" style="grid-column:3"><span class="summary-badge summary-badge-jun">류 준</span></div>';

  // 급식 카드 행 (now-indicator 범위 밖 — side-meal-* 클래스 사용)
  if (_mealData) {
    // KST 오늘 날짜 문자열 (YYYYMMDD)
    // meal.json date 필드에서 직접 요일 계산 → 금요일→다음주 월요일도 처리
    const _mealByDate = {};
    if (_mealData.yesterday && _mealData.yesterday.date) _mealByDate[_mealData.yesterday.date] = _mealData.yesterday;
    if (_mealData.today.date)    _mealByDate[_mealData.today.date]    = _mealData.today;
    if (_mealData.tomorrow.date) _mealByDate[_mealData.tomorrow.date] = _mealData.tomorrow;
    let _meal = null;
    for (const [ds, entry] of Object.entries(_mealByDate)) {
      if (!ds) continue;
      const dow = new Date(+ds.slice(0,4), +ds.slice(4,6)-1, +ds.slice(6,8)).getDay();
      const dayLabel = dow >= 1 && dow <= 5 ? DAYS[dow - 1] : null;
      if (currentDay === dayLabel) { _meal = entry; break; }
    }
    if (_meal && _meal.menus) {
      html += `<div class="side-meal-left">
        <div class="side-card" style="border-left-color:#10b981;min-height:auto;">
          <div class="event-card-header">
            <span class="event-time" style="font-size:var(--text-sm);font-weight:600;">급식정보(${+_meal.date.slice(4,6)}/${+_meal.date.slice(6,8)})</span>
            <span class="meal-tag">한아람초</span>
          </div>
          <div class="event-detail" style="word-break:keep-all;white-space:normal;">${_meal.menus.join(' · ')}</div>
        </div>
      </div>`;
      html += `<div style="grid-column:2"></div>`;
      html += `<div class="side-meal-right"></div>`;
    }
  }

  // Row-based layout: 좌/우 셀을 같은 grid row에 배치
  rows.forEach((row) => {
    if (row.left) {
      html += `<div class="side-cell side-cell-left">${buildSideCard(row.left, leftColorMap)}</div>`;
    } else {
      html += `<div class="side-cell-empty side-cell-empty-left"></div>`;
    }
    html += `<div style="grid-column:2"></div>`;
    if (row.right) {
      html += `<div class="side-cell side-cell-right">${buildSideCard(row.right, rightColorMap)}</div>`;
    } else {
      html += `<div class="side-cell-empty side-cell-empty-right"></div>`;
    }
  });

  html += '</div>';

  _sideRows = rows;
  area.innerHTML = html;

  document.fonts.ready.then(() => {
    requestAnimationFrame(() => renderNowIndicator(true));
  });
}

function renderNowIndicator(scrollToCenter) {
  const sbs = document.querySelector('.side-by-side');
  if (sbs) {
    const existing = sbs.querySelector('.now-indicator');
    if (existing) existing.remove();
  }

  if (!isToday()) return;
  if (!sbs || _sideRows.length === 0) return;

  const nowMin = getCurrentMinutes();

  // 각 행의 시간(분) 구하기
  const rowTimes = _sideRows.map(r => parseTime((r.left || r.right).time));
  const firstTime = rowTimes[0];
  const lastTime = rowTimes[rowTimes.length - 1];

  // 이벤트 범위 ±60분 벗어나면 비표시
  if (nowMin < firstTime - 60 || nowMin > lastTime + 60) return;

  const leftCells = sbs.querySelectorAll('.side-cell-left, .side-cell-empty-left');
  const rightCells = sbs.querySelectorAll('.side-cell-right, .side-cell-empty-right');
  if (leftCells.length === 0) return;

  const sbsRect = sbs.getBoundingClientRect();
  const rowPositions = [];
  for (let i = 0; i < leftCells.length; i++) {
    const lRect = leftCells[i].getBoundingClientRect();
    const rRect = rightCells[i] ? rightCells[i].getBoundingClientRect() : lRect;
    rowPositions.push({
      timeMin: rowTimes[i],
      top: Math.min(lRect.top, rRect.top) - sbsRect.top,
      bottom: Math.max(lRect.bottom, rRect.bottom) - sbsRect.top,
    });
  }

  let indicatorY;
  if (nowMin <= rowPositions[0].timeMin) {
    indicatorY = rowPositions[0].top - 6;
  } else if (nowMin > rowPositions[rowPositions.length - 1].timeMin) {
    indicatorY = rowPositions[rowPositions.length - 1].bottom + 6;
  } else {
    let beforeIdx = 0;
    for (let i = 0; i < rowPositions.length; i++) {
      if (rowPositions[i].timeMin < nowMin) beforeIdx = i;
    }
    const afterIdx = beforeIdx + 1;
    const before = rowPositions[beforeIdx];
    const after = rowPositions[afterIdx];
    indicatorY = (before.bottom + after.top) / 2;
  }

  const indicator = document.createElement('div');
  indicator.className = 'now-indicator';
  indicator.style.top = indicatorY + 'px';
  indicator.innerHTML = `
    <div class="now-indicator-line"></div>
    <div class="now-indicator-dot"></div>
  `;
  sbs.appendChild(indicator);

  // is-past 제거 + 추가를 한 번에 처리 (깜빡임 방지)
  for (let i = 0; i < rowTimes.length; i++) {
    const lCard = leftCells[i] && leftCells[i].querySelector('.side-card');
    const rCard = rightCells[i] && rightCells[i].querySelector('.side-card');
    const isPast = rowTimes[i] < nowMin;
    if (lCard) lCard.classList.toggle('is-past', isPast);
    if (rCard) rCard.classList.toggle('is-past', isPast);
  }

  if (scrollToCenter) {
    indicator.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  applyGlowToNextCards();
}

function applyGlowToNextCards() {
  document.querySelectorAll('.glow-next').forEach(el => el.classList.remove('glow-next'));

  if (!isToday()) return;
  if (_sideRows.length === 0) return;

  const nowMin = getCurrentMinutes();

  const sbs = document.querySelector('.side-by-side');
  if (!sbs) return;

  const leftCells = sbs.querySelectorAll('.side-cell-left, .side-cell-empty-left');
  const rightCells = sbs.querySelectorAll('.side-cell-right, .side-cell-empty-right');

  // Next upcoming card glow
  let nextRowIdx = -1;
  for (let i = 0; i < _sideRows.length; i++) {
    const row = _sideRows[i];
    const rowTime = parseTime((row.left || row.right).time);
    if (rowTime >= nowMin) {
      nextRowIdx = i;
      break;
    }
  }

  if (nextRowIdx === -1) return;

  const glowCards = [];
  if (leftCells[nextRowIdx]) {
    const card = leftCells[nextRowIdx].querySelector('.side-card');
    if (card) glowCards.push(card);
  }
  if (rightCells[nextRowIdx]) {
    const card = rightCells[nextRowIdx].querySelector('.side-card');
    if (card) glowCards.push(card);
  }
  // 도트와 동기화: 애니메이션 리셋 후 동일 프레임에서 시작
  glowCards.forEach(card => {
    card.style.animation = 'none';
    card.offsetHeight; // force reflow
    card.style.animation = '';
    card.classList.add('glow-next');
  });

  // Relative time on glow cards
  if (isToday()) {
    const diff = parseTime((_sideRows[nextRowIdx].left || _sideRows[nextRowIdx].right).time) - nowMin;
    if (diff >= 0 && diff < 120) {
      glowCards.forEach(card => {
        const timeEl = card.querySelector('.event-time');
        if (timeEl && !timeEl.querySelector('.relative-time')) {
          const span = document.createElement('span');
          span.className = 'relative-time';
          span.textContent = ` (${diff}분 후)`;
          timeEl.appendChild(span);
        }
      });
    }
  }
}

// 정분(XX:00)에 맞춰 갱신 동기화
const _startDate = new Date().getDate();
function scheduleMinuteSync() {
  const msToNextMin = (60 - new Date().getSeconds()) * 1000;
  setTimeout(() => {
    if (new Date().getDate() !== _startDate) { location.reload(); return; }
    if (isToday()) renderNowIndicator();
    else applyGlowToNextCards();
    renderHeaderSubtitle();
    setInterval(() => {
      if (new Date().getDate() !== _startDate) { location.reload(); return; }
      if (isToday()) renderNowIndicator();
      else applyGlowToNextCards();
      renderHeaderSubtitle();
    }, 60000);
  }, msToNextMin);
}
scheduleMinuteSync();

renderDays();
render();
renderHeaderSubtitle();

// ─── Weather Widget ───
const SVG_ICON = (d) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const WI = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',

};
function getDustGrade(pm, type) {
  if (pm == null || isNaN(pm)) return null;
  const thresholds = type === 'pm10' ? [30, 80, 150] : [15, 35, 75];
  const grades = [
    { label: '좋음',     color: '#38bdf8', face: 'good' },
    { label: '보통',     color: '#22c55e', face: 'good' },
    { label: '나쁨',     color: '#f97316', face: 'bad' },
    { label: '매우나쁨', color: '#ef4444', face: 'bad' },
  ];
  for (let i = 0; i < thresholds.length; i++) {
    if (pm <= thresholds[i]) return grades[i];
  }
  return grades[3];
}

function renderDust(data) {
  const widget = document.getElementById('dustWidget');
  const g10 = getDustGrade(data.pm10, 'pm10');
  const g25 = getDustGrade(data.pm25, 'pm25');

  if (!g10 && !g25) { widget.hidden = true; return; }
  widget.hidden = false;

  function dustFaceSVG(color, face) {
    const mouth = face === 'good'
      ? '<path d="M4.5 8.5c0 0 1.5 2 3.5 2s3.5-2 3.5-2" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>'
      : '<path d="M4.5 10.5c0 0 1.5-2 3.5-2s3.5 2 3.5 2" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 16 16" width="13" height="13" fill="none">'
      + '<circle cx="8" cy="8" r="7" fill="' + color + '"/>'
      + '<circle cx="5.5" cy="6" r="1" fill="#fff"/>'
      + '<circle cx="10.5" cy="6" r="1" fill="#fff"/>'
      + mouth + '</svg>';
  }

  function applyGrade(faceEl, info) {
    const row = faceEl.closest('.dust-row');
    if (!info) { row.hidden = true; return; }
    row.hidden = false;
    faceEl.innerHTML = dustFaceSVG(info.color, info.face);
  }

  applyGrade(document.getElementById('dustFace10'), g10);
  applyGrade(document.getElementById('dustFace25'), g25);

  const parts = [];
  if (g10) parts.push('미세먼지 ' + g10.label + (data.pm10 != null ? ' ' + data.pm10 + 'µg' : ''));
  if (g25) parts.push('초미세먼지 ' + g25.label + (data.pm25 != null ? ' ' + data.pm25 + 'µg' : ''));
  document.getElementById('dustSr').textContent = parts.join(', ');
}

function getWeatherInfo(sky, pty) {
  // 강수형태 우선
  if (pty == 1 || pty == 5) return { icon: SVG_ICON(WI.rain), label: pty == 5 ? '빗방울' : '비' };
  if (pty == 2 || pty == 6) return { icon: SVG_ICON(WI.snow), label: pty == 6 ? '빗방울눈날림' : '비/눈' };
  if (pty == 3 || pty == 7) return { icon: SVG_ICON(WI.snow), label: pty == 7 ? '눈날림' : '눈' };
  if (pty == 4) return { icon: SVG_ICON(WI.drizzle), label: '소나기' };
  // 하늘상태
  if (sky == 1) return { icon: SVG_ICON(WI.sun), label: '맑음' };
  if (sky == 3) return { icon: SVG_ICON(WI.cloudSun), label: '구름많음' };
  if (sky == 4) return { icon: SVG_ICON(WI.cloud), label: '흐림' };
  return { icon: SVG_ICON(WI.cloud), label: '날씨' };
}

function renderWeather(data) {
  const info = getWeatherInfo(data.sky, data.pty);
  document.getElementById('weatherIcon').innerHTML = info.icon;
  document.getElementById('weatherTemp').textContent = data.temp + '°';
  document.getElementById('weatherLow').textContent = data.min != null ? data.min + '°' : '--';
  document.getElementById('weatherHigh').textContent = data.max != null ? data.max + '°' : '--';
  const minTxt = data.min != null ? data.min + '도' : '정보없음';
  const maxTxt = data.max != null ? data.max + '도' : '정보없음';
  document.getElementById('weatherSr').textContent =
    info.label + ', 현재 ' + data.temp + '도, 최저 ' + minTxt + ', 최고 ' + maxTxt;
  document.getElementById('weatherWidget').classList.add('loaded');
  renderDust(data);

  // 업데이트 시간 표시
  if (data.updatedAt) {
    const d = new Date(data.updatedAt);
    const h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, '0');
    const ampm = h >= 12 ? '오후' : '오전';
    const dh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
    const el = document.getElementById('weatherUpdated');
    if (el) el.textContent = `${ampm} ${dh}:${m} 기준`;
  }
}

async function loadWeather() {
  try {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 5000);
    const res = await fetch('https://pickup-proxy.jeonghun-ryu.workers.dev/weather.json', { signal: controller.signal });
    clearTimeout(tid);
    const data = await res.json();
    localStorage.setItem('weather_cache_v2', JSON.stringify({ data, ts: Date.now() }));
    renderWeather(data);
  } catch (e) {
    const cached = localStorage.getItem('weather_cache_v2');
    if (cached) renderWeather(JSON.parse(cached).data);
  }
}

// 이전 버전 캐시 정리
localStorage.removeItem('weather_cache');
localStorage.removeItem('meal_cache');

loadWeather();
setInterval(loadWeather, 10 * 60 * 1000);

// ─── Swipe navigation ───
let _touchStartX = 0, _touchStartY = 0;
document.getElementById('scheduleArea').addEventListener('touchstart', (e) => {
  _touchStartX = e.touches[0].clientX;
  _touchStartY = e.touches[0].clientY;
}, { passive: true });

document.getElementById('scheduleArea').addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - _touchStartX;
  const dy = e.changedTouches[0].clientY - _touchStartY;
  const screenW = window.innerWidth;
  // Only detect in center 60% of screen
  if (_touchStartX < screenW * 0.2 || _touchStartX > screenW * 0.8) return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const idx = DAYS.indexOf(currentDay);
    if (dx < 0 && idx < 4) selectDay(DAYS[idx + 1]);
    else if (dx > 0 && idx > 0) selectDay(DAYS[idx - 1]);
  }
}, { passive: true });

  navigator.serviceWorker.register('./sw.js').catch(() => {});
